<svg xmlns="http://www.w3.org/2000/svg" width="880" height="148" viewBox="0 0 880 148" role="img" aria-label="bynnwong terminal banner">
  <title>bynnwong</title>
  <defs>
    <pattern id="scan" width="880" height="4" patternUnits="userSpaceOnUse">
      <rect width="880" height="1" fill="#00ff41" opacity=".05"/>
    </pattern>
  </defs>
  <rect width="880" height="148" fill="#050805"/>
  <rect width="880" height="148" fill="url(#scan)"/>
  <rect x="8" y="8" width="864" height="132" fill="none" stroke="#00ff41" stroke-opacity=".55"/>
  <rect x="12" y="12" width="856" height="124" fill="none" stroke="#00ff41" stroke-opacity=".16"/>
  <text font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#3d8a3d" x="28" y="38">root@bynnwong:~# ./identify</text>
  <text font-family="ui-monospace, Menlo, Consolas, monospace" font-size="42" font-weight="700" fill="#00ff41" x="28" y="88" letter-spacing="6">BYNN</text>
  <text font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#7CFF9A" x="28" y="116">UI DESIGNER   ·   LINUX   ·   2017 — 2026</text>
  <rect x="28" y="124" width="10" height="14" fill="#00ff41">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
